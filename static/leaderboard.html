<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberHerd Leaderboard</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 2rem;
            background: #0f1115;
            color: #f5f5f5;
        }

        a,
        a:visited {
            color: #7dd3fc;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            text-align: center;
        }

        p.description {
            text-align: center;
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #cbd5f5;
        }

        #status {
            text-align: center;
            margin: 1rem 0;
            font-style: italic;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            overflow: hidden;
        }

        thead {
            background: rgba(255, 255, 255, 0.08);
        }

        th, td {
            padding: 0.85rem;
            text-align: left;
        }

        th {
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #a5b4fc;
        }

        tbody tr:nth-child(odd) {
            background: rgba(255, 255, 255, 0.02);
        }

        tbody tr:hover {
            background: rgba(125, 211, 252, 0.12);
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .member-info img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.65rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge.active {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        .badge.inactive {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            table, thead, tbody, th, td, tr {
                display: block;
            }

            thead {
                display: none;
            }

            tr {
                margin-bottom: 1rem;
                border-radius: 8px;
                border: 1px solid rgba(255, 255, 255, 0.05);
                padding: 0.75rem;
            }

            td {
                padding: 0.4rem 0;
            }

            td::before {
                content: attr(data-label);
                display: block;
                font-size: 0.75rem;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                color: #a5b4fc;
                margin-bottom: 0.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CyberHerd Leaderboard</h1>
        <div id="status">Loading leaderboard...</div>
        <table hidden id="leaderboard-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Member</th>
                    <th>Zap Amount (sats)</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const tableEl = document.getElementById('leaderboard-table');
        const tbodyEl = document.getElementById('leaderboard-body');
        const MAX_ENTRIES = 10;
        const REFRESH_INTERVAL_MS = 60000;
        const BASE_RECONNECT_DELAY = 2000;

        const queryParams = new URLSearchParams(window.location.search);
        let requestedPubkey = '';
        // The websocket target is always derived from the page's own origin.
        // Accepting host/port/scheme from query params would let an attacker
        // point the socket at a server they control and inject leaderboard
        // rows that execute in this trusted origin — so the overrides are gone.
        let lnbitsHost = window.location.hostname || '127.0.0.1';
        let lnbitsPort = window.location.port || '';
        (function initFromPath() {
            const path = window.location.pathname || '';
            const params = new URLSearchParams(window.location.search);
            const segments = path.split('/').filter(Boolean);
            const leaderboardIdx = segments.findIndex(seg => seg.toLowerCase() === 'leaderboard');
            if (leaderboardIdx !== -1 && segments[leaderboardIdx + 1]) {
                requestedPubkey = decodeURIComponent(segments[leaderboardIdx + 1]);
            } else {
                requestedPubkey = params.get('pubkey') || '';
            }
        })();

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Only allow http(s) image URLs; reject javascript:, data:, etc.
        function safeImageUrl(value) {
            const raw = String(value == null ? '' : value).trim();
            if (!raw) return '';
            try {
                const u = new URL(raw, window.location.origin);
                if (u.protocol === 'http:' || u.protocol === 'https:') {
                    return u.href;
                }
            } catch (e) {
                return '';
            }
            return '';
        }

        let cachedEntries = [];
        let refreshTimer = null;
        let websocket = null;
        let reconnectDelay = BASE_RECONNECT_DELAY;
        let wsInitialized = false;

        function formatAmount(value) {
            return Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
        }

        function resolveWebsocketScheme() {
            return window.location.protocol === 'https:' ? 'wss' : 'ws';
        }

        function buildLeaderboardWebSocketUrl(pubkey) {
            if (!pubkey) {
                return null;
            }
            const protocol = resolveWebsocketScheme();
            const portSegment = lnbitsPort ? `:${lnbitsPort}` : '';
            return `${protocol}://${lnbitsHost}${portSegment}${extensionBase}/ws/leaderboard/${encodeURIComponent(pubkey)}`;
        }

        function logWsMessage(message) {
            console.debug(`[leaderboard-ws] ${message}`);
        }

        const extensionBase = window.location.pathname.startsWith('/cyberherd')
            ? '/cyberherd'
            : '/extensions/cyberherd';

        function renderLeaderboard(entries) {
            cachedEntries = entries.slice(0, MAX_ENTRIES);
            tbodyEl.innerHTML = '';
            if (!cachedEntries.length) {
                statusEl.textContent = 'No members found for this CyberHerd.';
                tableEl.hidden = true;
                return;
            }

            tableEl.hidden = false;
            statusEl.textContent = '';

            cachedEntries.forEach((entry, index) => {
                const tr = document.createElement('tr');
                // All member-supplied fields (display_name, picture, pubkey) come
                // from arbitrary Nostr profile metadata and MUST be escaped/validated
                // before being placed in the DOM.
                const displayName = escapeHtml(entry.display_name || 'Anon');
                const pictureUrl = safeImageUrl(entry.picture);
                const pubkeyShort = entry.pubkey ? escapeHtml(String(entry.pubkey).slice(0, 8)) + '…' : '';
                const avatar = pictureUrl
                    ? `<img src="${escapeHtml(pictureUrl)}" alt="${displayName}" referrerpolicy="no-referrer" loading="lazy"/>`
                    : `<div style="width:48px;height:48px;border-radius:50%;background:#1f2937;display:flex;align-items:center;justify-content:center;">🟣</div>`;
                tr.innerHTML = `
                    <td data-label="Rank">${index + 1}</td>
                    <td data-label="Member">
                        <div class="member-info">
                            ${avatar}
                            <div>
                                <div>${displayName}</div>
                                <div style="font-size:0.8rem;color:#94a3b8;">${pubkeyShort}</div>
                            </div>
                        </div>
                    </td>
                    <td data-label="Zap Amount">
                        <div>
                            <div style="font-weight:600;">${formatAmount(entry.historical_sats || 0)}</div>
                        </div>
                    </td>
                    <td data-label="Status">
                        <span class="badge ${entry.is_active ? 'active' : 'inactive'}">
                            ${entry.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                `;
                tbodyEl.appendChild(tr);
            });
        }

        async function loadLeaderboard(isRefresh = false) {
            if (!requestedPubkey) {
                statusEl.innerHTML = 'Please provide a <code>pubkey</code> query parameter.';
                tableEl.hidden = true;
                return;
            }

            try {
                if (!isRefresh) {
                    statusEl.textContent = 'Loading leaderboard...';
                }
                const resp = await fetch(`${extensionBase}/api/v1/leaderboard?pubkey=${encodeURIComponent(requestedPubkey)}`);
                if (!resp.ok) {
                    throw new Error(`Request failed: ${resp.status}`);
                }
                const data = await resp.json();
                renderLeaderboard(data.leaderboard || []);
                if (!wsInitialized) {
                    startWebsocket();
                }
            } catch (err) {
                console.error(err);
                if (!isRefresh) {
                    statusEl.textContent = 'Failed to load leaderboard. Please try again later.';
                    tableEl.hidden = true;
                }
            }
        }

        function scheduleRefresh() {
            if (refreshTimer) {
                clearInterval(refreshTimer);
            }
            refreshTimer = setInterval(() => loadLeaderboard(true), REFRESH_INTERVAL_MS);
        }

        function handleWebsocketMessage(event) {
            try {
                const payload = JSON.parse(event.data);
                if (payload && payload.type === 'leaderboard_update') {
                    renderLeaderboard(payload.leaderboard || []);
                }
            } catch (err) {
                console.debug('Leaderboard WebSocket non-JSON payload:', event.data);
            }
        }

        function startWebsocket() {
            if (wsInitialized) {
                return;
            }
            if (!requestedPubkey) {
                logWsMessage('Live updates unavailable (missing pubkey).');
                return;
            }
            wsInitialized = true;
            connectWebsocket();
        }

        function connectWebsocket() {
            const wsUrl = buildLeaderboardWebSocketUrl(requestedPubkey);
            if (!wsUrl) {
                logWsMessage('Unable to build leaderboard WebSocket URL.');
                scheduleRefresh();
                return;
            }

            logWsMessage(`Connecting to leaderboard feed…`);
            try {
                websocket = new WebSocket(wsUrl);
            } catch (err) {
                console.error('Failed to open leaderboard WebSocket', err);
                scheduleReconnect();
                return;
            }

            websocket.onopen = () => {
                reconnectDelay = BASE_RECONNECT_DELAY;
                logWsMessage('Live leaderboard connection active.');
            };
            websocket.onmessage = handleWebsocketMessage;
            websocket.onerror = () => {
                logWsMessage('Live connection error; retrying…');
            };
            websocket.onclose = () => {
                logWsMessage('Live connection closed; attempting to reconnect…');
                scheduleReconnect();
            };
        }

        function scheduleReconnect() {
            if (websocket) {
                try {
                    websocket.close();
                } catch (_) {}
                websocket = null;
            }
            const delay = reconnectDelay;
            reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
            setTimeout(connectWebsocket, delay);
        }

        loadLeaderboard();
        scheduleRefresh();
        startWebsocket();
    </script>
</body>
</html>
